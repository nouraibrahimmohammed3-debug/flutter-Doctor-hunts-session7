name: doctor_hunt
description: Doctor Hunt healthcare application.
publish_to: none
version: 1.0.0+1


environment:
  sdk: '^3.9.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  go_router: 17.2.3
  flutter_bloc: ^9.1.1
  gap: ^3.0.1
  easy_date_timeline: ^2.0.9
  intl: ^0.20.2
  slang: ^4.19.0
  slang_flutter: ^4.19.0
  firebase_auth: ^6.6.1
  firebase_core: ^4.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.15.1
  slang_build_runner: ^4.19.0


flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/categories/
    - assets/images/doctors/
